name: CI

# Deployment is NOT done here. Cloudflare Pages is connected directly to
# this repo and builds on every push to main (push-to-deploy). This
# workflow is the quality gate that runs alongside it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check crawler- and agent-facing files are present
        run: |
          # 404.html matters most: without it Pages answers every unknown URL
          # with the homepage and a 200.
          for f in robots.txt sitemap-index.xml 404.html llms.txt AGENTS.md \
                   paper-sizes.json .well-known/security.txt _headers _redirects; do
            test -s "dist/$f" || { echo "dist/$f missing"; exit 1; }
          done
