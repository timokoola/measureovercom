name: CI

# Deployment is NOT done here. Cloudflare Pages is connected directly to
# this repo and builds on every push to main (push-to-deploy). This
# workflow is the quality gate that runs alongside it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check robots.txt and sitemap are present
        run: |
          test -s dist/robots.txt || { echo "dist/robots.txt missing"; exit 1; }
          test -s dist/sitemap-index.xml || { echo "dist/sitemap-index.xml missing"; exit 1; }
